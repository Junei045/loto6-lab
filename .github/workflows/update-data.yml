name: ロト6データ自動更新

on:
  schedule:
    # 抽せんは毎週月・木（日本時間18:45頃）。UTC 14:00 = JST 23:00 に取得
    - cron: '0 14 * * 1,4'
  workflow_dispatch:   # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 依存パッケージ
        run: pip install numpy
      - name: データ取得・統計再計算
        run: python update_loto6_data.py
      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: 自動更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
